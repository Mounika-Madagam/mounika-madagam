[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marketing-campaign-segmentation-qc"
version = "1.0.0"
description = "Reproducible marketing audience segmentation, holdout allocation and QC waterfall using synthetic data"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Mounika Madagam"}]
keywords = ["marketing-analytics", "sql", "audience-segmentation", "quality-control", "sqlite"]

[project.scripts]
campaign-qc = "campaign_qc.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["campaign_qc*"]

[tool.setuptools.package-data]
campaign_qc = []

name: Marketing Campaign Segmentation QC
on:
  push:
    paths:
      - "portfolio-projects/marketing-campaign-segmentation-qc/**"
      - ".github/workflows/marketing-campaign-qc.yml"
  pull_request:
    paths:
      - "portfolio-projects/marketing-campaign-segmentation-qc/**"
      - ".github/workflows/marketing-campaign-qc.yml"
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portfolio-projects/marketing-campaign-segmentation-qc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: End-to-end demo
        run: python -m campaign_qc run --output out --config config/demo_campaign.json --count 3000 --seed 42
